[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sjamal-utilities"
version = "0.1.0"
description = "Reusable Python utilities: file I/O, config loading, logging, retries, and environment validation."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jamal Siadat", email = "jamals@example.com"},
]
keywords = [
    "utilities",
    "helpers",
    "file-operations",
    "configuration",
    "logging",
    "retry",
    "environment",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
]
yaml = ["pyyaml>=5.0"]
all = ["sjamal-utilities[yaml]"]

[project.urls]
Homepage = "https://github.com/sjamal/python-utilities"
Documentation = "https://github.com/sjamal/python-utilities#readme"
Repository = "https://github.com/sjamal/python-utilities.git"
Issues = "https://github.com/sjamal/python-utilities/issues"

[tool.setuptools]
packages = ["sjamal_utilities"]

[tool.black]
line-length = 100
target-version = ["py38"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
